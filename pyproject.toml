[project]
name = "inspect-ai-thermostat"
version = "0.1.0"
description = "Inspect AI evaluation for thermostat-control safety and preference adherence"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "data/LICENSE"]
authors = [
    { name = "Cristian Dinu", email = "gh-inspect-ai-experiment-tools-thermostat@cdi.nu" },
]
dependencies = [
    "anthropic>=0.112.0",
    "inspect-ai>=0.3.241",
    "mistralai>=2.5.0",
    "openai>=2.44.0",
    "openrouter>=0.10.7",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.0",
    "rich>=15.0.0",
]

[project.scripts]
thermostat-models = "thermostat_eval.models:main"
thermostat-scenarios = "thermostat_eval.cli:main"

[project.entry-points.inspect_ai]
thermostat_eval = "thermostat_eval._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thermostat_eval"]

[tool.hatch.build.targets.wheel.force-include]
data = "data"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
